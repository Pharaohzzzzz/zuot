[project]
name = "zuot"
version = "0.1.0"
description = "Daily sell-first T (reverse-T) research and signal system for 300308 / 300476"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "baostock>=0.8.9",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "matplotlib>=3.8",
]

[project.scripts]
zuot = "zuot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zuot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
